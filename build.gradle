// Root build file to forcefully disable the ktlint plugin across all sub-modules
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    tasks.whenTaskAdded { task ->
        if (task.name.contains("ktlint") || task.name.contains("lintKotlin")) {
            task.enabled = false
        }
    }
}
