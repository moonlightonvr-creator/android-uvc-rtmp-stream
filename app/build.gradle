plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capture.clipper'
    compileSdk 34

    defaultConfig {
        applicationId "com.capture.clipper"
        minSdk 23
        targetSdk 34
        versionCode 12
        versionName "12.0" // Force-bumps the cache integer to completely reset the Actions runner cache
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Self-contained library configuration that fixes the missing serenegiant dependencies
    implementation 'com.github.saki4510t:UVCCamera:v2.3.4'
}
