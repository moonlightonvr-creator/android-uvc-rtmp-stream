plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capture.clipper'
    compileSdk 34

    defaultConfig {
        applicationId "com.capture.clipper"
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName "11.0" // Force-bumps the cache integer to completely reset the Actions runner cache
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // The canonical, un-fragmented master path that JitPack can actively index and download
    implementation 'com.github.jiangdongguo:AndroidUSBCamera:2.3.4'
}
