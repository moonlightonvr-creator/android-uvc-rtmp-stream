plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capture.clipper'
    compileSdk 34

    defaultConfig {
        applicationId "com.capture.clipper"
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName "10.0" // Force bump cache
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Correctly targets the modern UVC hardware library module that JitPack can actively compile
    implementation 'com.github.jiangdongguo.AndroidUSBCamera:libausbc:3.3.3'
}
