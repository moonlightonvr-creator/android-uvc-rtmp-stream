plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capture.clipper'
    compileSdk 34

    defaultConfig {
        applicationId "com.capture.clipper"
        minSdk 23
        targetSdk 34
        versionCode 16
        versionName "16.0" // Bumps cache to force a completely clean execution track
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Forces the build engine to completely turn off the broken ktlint checks
tasks.whenTaskAdded { task ->
    if (task.name.contains("ktlint") || task.name.contains("lintKotlin")) {
        task.enabled = false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // The canonical, un-fragmented master path that JitPack can actively index and download
    implementation 'com.github.jiangdongguo:AndroidUSBCamera:2.3.4'
}
