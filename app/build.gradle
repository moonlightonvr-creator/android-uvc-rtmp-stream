plugins {
    id 'com.android.application'
}

android {
    namespace 'com.capture.clipper'
    compileSdk 34

    defaultConfig {
        applicationId "com.capture.clipper"
        minSdk 23
        targetSdk 34
        versionCode 14
        versionName "14.0" // Force-bumps cache to completely reset the Actions runner pipeline
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Stable release target that loads raw UVC binaries completely inline without module dependency errors
    implementation 'com.github.saki4510t:UVCCamera:v2.1.3'
}
